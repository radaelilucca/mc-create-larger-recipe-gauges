name: Build release tag

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Newly created semantic tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate tag and build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          chmod +x ./gradlew
          ./gradlew -Pmod_version="${RELEASE_TAG#v}" buildAll verifyAll --no-daemon --no-parallel --console=plain
          find forge1201/build/libs neoforge/build/libs -maxdepth 1 -type f \( -name '*.jar' \) ! -name '*-dev.jar' -print0 | xargs -0 -r sha256sum > checksums.sha256
          test -s checksums.sha256
      - name: Prepare player-facing release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          awk -v heading="## [$version]" '
            $0 == heading { found=1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --notes-file release-notes.md --title "Create: Larger Recipe Gauges $RELEASE_TAG"
          mapfile -t artifacts < <(find forge1201/build/libs neoforge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' -print | sort)
          test "${#artifacts[@]}" -gt 0
          gh release upload "$RELEASE_TAG" "${artifacts[@]}" checksums.sha256 --clobber
